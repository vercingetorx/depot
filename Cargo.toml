[package]
name = "depot"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.4"
bytes = "1.10"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
libcrux-ml-dsa = { version = "0.0.8", features = ["mldsa87"] }
libcrux-ml-kem = { version = "0.0.8", features = ["mlkem1024"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
unicode-width = "0.2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
